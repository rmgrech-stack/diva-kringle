<style>
:root{
  --velvet:#24030f; --velvet2:#3d0820; --pink:#ff2e93; --pink2:#ff7ac0;
  --gold:#f5c542; --gold2:#fff1b8; --ice:#e8f4ff; --ink:#fff6fb; --muted:#e6b3cf;
  --card:rgba(255,255,255,.07); --line:rgba(245,197,66,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 20% 10%,rgba(255,46,147,.35),transparent 45%),
    radial-gradient(circle at 85% 30%,rgba(245,197,66,.18),transparent 40%),
    radial-gradient(circle at 50% 100%,rgba(255,46,147,.25),transparent 50%),
    linear-gradient(160deg,var(--velvet),var(--velvet2) 60%,#14010a);
  background-attachment:fixed;
  overflow-x:hidden;
}
body::before{ /* sequins */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(circle,rgba(255,241,184,.9) 0 1.2px,transparent 1.6px),
                   radial-gradient(circle,rgba(255,122,192,.9) 0 1px,transparent 1.4px);
  background-size:26px 26px,38px 38px;background-position:0 0,13px 19px;
  animation:twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.12}to{opacity:.3}}
.snow{position:fixed;top:-12px;color:#fff;pointer-events:none;opacity:.8;animation:fall linear infinite;z-index:0}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:22px 16px 80px}
header{text-align:center;padding:10px 0 6px}
.ball{width:74px;height:74px;margin:0 auto 4px;animation:spin 6s linear infinite;filter:drop-shadow(0 0 18px rgba(255,46,147,.7))}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
h1{font-family:"Abril Fatface",serif;font-size:clamp(42px,11vw,72px);margin:0;line-height:.95;letter-spacing:1px;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,#b8860b 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(245,197,66,.25)}
.script{font-family:"Great Vibes",cursive;color:var(--pink2);font-size:clamp(24px,6vw,34px);margin:2px 0 0}
.tag{color:var(--muted);font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.marquee{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:rgba(0,0,0,.25)}
.chip b{color:var(--gold)}

nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0}
nav button{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);
  padding:9px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--pink),#c4126b);border-color:var(--pink2);box-shadow:0 0 18px rgba(255,46,147,.55)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;
  backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
h2{font-family:"Abril Fatface",serif;font-weight:400;font-size:26px;margin:0 0 4px;color:var(--gold)}
h3{margin:0 0 6px;font-size:17px}
p.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--gold2);margin:12px 0 5px;letter-spacing:.5px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,147,.25)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;color:#2a0012;
  background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 6px 20px rgba(245,197,66,.3)}
.btn.pink{color:#fff;background:linear-gradient(135deg,var(--pink),#c4126b);box-shadow:0 6px 20px rgba(255,46,147,.4)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.name{font:inherit;font-family:"Abril Fatface",serif;font-size:22px;color:var(--ink);padding:18px 10px;border-radius:16px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,46,147,.25),rgba(0,0,0,.3));border:1px solid var(--line)}
.name:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(245,197,66,.35)}
.name[disabled]{opacity:.35;cursor:not-allowed}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}
.ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,rgba(255,46,147,.25),rgba(245,197,66,.15))}
.item .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.item .t{font-weight:700;font-size:16px}
.price{font-family:"Abril Fatface",serif;color:var(--gold);font-size:18px}
.over{display:inline-block;background:var(--pink);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.note{color:var(--muted);font-size:13px;white-space:pre-wrap}
.item a{color:var(--pink2);font-weight:700;font-size:14px;word-break:break-all}
.item .acts{margin-top:auto;display:flex;gap:6px;padding-top:6px}

.who{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .big{font-size:44px}
.preview{margin-top:8px;width:110px;height:110px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}

.envelope{perspective:900px;margin:10px auto;max-width:360px}
.flip{position:relative;width:100%;aspect-ratio:3/2;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.front{background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,#c9971b);color:#3a0018;box-shadow:0 10px 40px rgba(245,197,66,.35)}
.front .seal{width:58px;height:58px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 0 4px rgba(255,255,255,.5);margin-bottom:10px}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--pink),#8a0a4a);color:#fff;box-shadow:0 0 50px rgba(255,46,147,.6)}
.back .nm{font-family:"Abril Fatface",serif;font-size:clamp(34px,9vw,50px);color:var(--gold2)}

.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pair{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.pair button{background:none;border:0;color:var(--pink2);cursor:pointer;font-size:15px}
.plist .prow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.plist .prow .st{font-size:12px;color:var(--muted);white-space:nowrap}
.wheelbox{position:relative;width:min(340px,86vw);margin:14px auto 6px}
.wheelbox canvas{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 0 0 6px var(--gold),0 0 0 10px #7a0a40,0 0 50px rgba(255,46,147,.6)}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));z-index:2}
.hub{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pink) 45%,#7a0a40);box-shadow:0 0 0 4px var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2}
.result{font-family:"Abril Fatface",serif;font-size:clamp(30px,8vw,44px);color:var(--gold2);margin:8px 0 0;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:linear-gradient(135deg,var(--pink),#7a0a40);display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}
.meRow{display:flex;align-items:center;gap:12px}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:7;pointer-events:none;animation:conf 2.6s ease-in forwards}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.sndbtn{font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.sndbtn.on{border-color:var(--pink2);box-shadow:0 0 12px rgba(255,46,147,.5)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(100px);background:#111;border:1px solid var(--gold);color:var(--ink);
  padding:12px 18px;border-radius:14px;z-index:9;transition:transform .3s;font-weight:500;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,0,5,.75);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:460px;width:100%;max-height:90vh;overflow:auto}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>
</head>

const SND=(()=>{

  const ctx=()=>{ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.55; master.connect(ac.destination);}catch{ return null; } } if(ac.state==='suspended') ac.resume(); return ac; };
  function tone(f,t,d,{type='sine',vol=.25,glide=0,attack=.005,cut=0}={}){ const a=ctx(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(glide) o.frequency.exponentialRampToValueAtTime(glide,t+d);

    cfg.limit ? `<span class="chip">Limit <b>${money(cfg.limit)}</b></span>`:'',

    `<span class="chip">${cfg.drawn ? '<b>Names drawn</b> ✨' : 'Draw <b>pending</b>'}</span>`
  ].join('') : '';

  if(!cfg || !ppl.length){
    nav.innerHTML='';
    if(isOwner || !cfg){ tab='admin'; app.innerHTML = adminView(true); bindAdmin(); return; }
    else app.innerHTML = `<div class="card empty"><div class="big">🎤</div>Mother is still setting the stage. Check back soon.</div>`;
    return;
  }
  const me = myKey();
  const tabs = [];
  if(me){ tabs.push(['list','My wishlist'],['giftee','My giftee'],['all','The runway']); }
  if(isOwner) tabs.push(['admin',"Mother's desk"]);
  if(!me && tab!=='admin') tab='pick';
  if(me && tab==='pick') tab='list';
  if(!tabs.find(t=>t[0]===tab) && tab!=='pick') tab = tabs[0]?.[0] || 'pick';
  nav.innerHTML = (me ? '' : (isOwner?`<button data-t="pick" class="${tab==='pick'?'on':''}">Pick your name</button>`:'')) +
    tabs.map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; revealed=false; render();});

  if(tab==='pick') { app.innerHTML = pickView(); bindPick(); }
  else if(tab==='list') { app.innerHTML = listView(me); bindList(me); }
  else if(tab==='giftee') { app.innerHTML = gifteeView(me); bindGiftee(); }
  else if(tab==='all') { app.innerHTML = allView(me); }
  else if(tab==='admin') { app.innerHTML = adminView(false); bindAdmin(); }

function bindPick(){
  app.querySelectorAll('.name').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, nm=nameOf(k), exists=!!claimData[k]?.pinHash;
    openModal(`<h2>${exists?`Welcome back, ${esc(nm)}`:`You're ${esc(nm)}?`}</h2><p class="sub">${exists?'Enter your PIN.':'Choose a 4-digit PIN so nobody else can edit your list. Don\'t forget it.'}</p>

    try{ await (it?db.doc('items/'+it.id).set(data):db.collection('items').add(data)); closeModal(); toast(it?'Updated ✨':'Added to the runway ✨'); SND.play('sparkle'); SND.say('saved'); }
    catch(e){ $('#fSave').disabled=false; writeFail(e); }
  };
}
function shrink(file,M=520,square=false){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
    const c=document.createElement('canvas'), x=c.getContext('2d');
    if(square){ const s=Math.min(im.width,im.height); c.width=c.height=Math.min(M,s);
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,c.width,c.height); }
    else { const sc=Math.min(1,M/Math.max(im.width,im.height)); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); x.drawImage(im,0,0,c.width,c.height); }
    res(c.toDataURL('image/jpeg',.75)); }; im.src=r.result; }; r.readAsDataURL(file); });
}

// ---------- giftee: spin the wheel ----------
const ICONS=['👑','💄','👠','🪩','💋','🎤','💎','🦩','✨','🌟'];
let spinning=false, wheelRot=0, revealLine='';
function gifteeView(me){
  if(!cfg.drawn || !cfg.pairs?.[me]) return `<div class="card empty"><div class="big">🎰</div>Names haven't been drawn yet. Mother will spin things up soon. Get your wishlist fierce in the meantime.</div>`;
  const g=cfg.pairs[me], theirs=items.filter(i=>i.owner===g);
  return `<div class="card" style="text-align:center"><h2>Spin the wheel, diva</h2>
    <p class="sub">${revealed?'The wheel has spoken.':'Make sure nobody\'s peeking, then spin.'}</p>
    <div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="680" height="680"></canvas><div class="hub">🪩</div></div>
    ${revealed?`<div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:10px">You're gifting</div><div class="result">${esc(nameOf(g))}</div>${revealLine?`<div class="script" style="font-size:26px;margin-top:4px">“${esc(revealLine.replace(/\s*It's [^!.]*[!.]\s*/,' ').replace(/^It's [^!.]*[!.]\s*/,'').trim())}”</div>`:''}${cfg.limit?`<div class="muted">Limit ${money(cfg.limit)}</div>`:''}
      <div class="btns" style="justify-content:center"><button class="btn ghost small" id="hide">Hide it again</button></div>`
      :`<div class="btns" style="justify-content:center"><button class="btn pink" id="spin">Spin ✨</button></div>`}</div>
    ${revealed?`<div class="card"><h2>${esc(nameOf(g))}'s wishlist</h2><p class="sub">${theirs.length?'Pick something they actually asked for. Revolutionary.':'Nothing on their list yet. Give them a nudge without giving the game away.'}</p></div>
    ${theirs.length?`<div class="items">${theirs.map(i=>itemCard(i,false)).join('')}</div>`:''}`:''}`;
}
function wheelSegs(me){ return people().filter(p=>p.k!==me).map(p=>({k:p.k,name:p.name,avatar:claimData[p.k]?.avatar,icon:ICONS[people().findIndex(q=>q.k===p.k)%ICONS.length]})); }
const imgCache={};
function loadImg(src){ if(!imgCache[src]) imgCache[src]=new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src;}); return imgCache[src]; }
async function drawWheel(cv, segs){
  const x=cv.getContext('2d'), W=cv.width, R=W/2, n=segs.length, a=2*Math.PI/n;
  const imgs=await Promise.all(segs.map(s=>s.avatar?loadImg(s.avatar):null));
  const cols=['#ff2e93','#3d0820','#f5c542','#8a0a4a','#ff7ac0','#24030f'];
  x.clearRect(0,0,W,W);
  segs.forEach((s,i)=>{
    const a0=-Math.PI/2+i*a-a/2;
    x.beginPath(); x.moveTo(R,R); x.arc(R,R,R-2,a0,a0+a); x.closePath();
    let c=cols[i%cols.length]; if(n%cols.length===1 && i===n-1) c=cols[2];
    x.fillStyle=c; x.fill(); x.strokeStyle='rgba(255,241,184,.8)'; x.lineWidth=3; x.stroke();
    const mid=a0+a/2, dark=(c==='#f5c542'||c==='#ff7ac0');
    x.save(); x.translate(R,R); x.rotate(mid);
    const pr=Math.min(58, R*Math.sin(a/2)*0.62), px=R*0.62;
    x.save(); x.translate(px,0); x.rotate(Math.PI/2);
    x.beginPath(); x.arc(0,0,pr,0,2*Math.PI); x.closePath();
    x.fillStyle='#24030f'; x.fill(); x.save(); x.clip();
    if(imgs[i]) x.drawImage(imgs[i],-pr,-pr,pr*2,pr*2);
    else { x.font=`${pr*1.1}px serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(s.icon,0,pr*0.08); }
    x.restore(); x.lineWidth=5; x.strokeStyle='#fff1b8'; x.stroke();
    x.fillStyle=dark?'#3a0018':'#fff6fb'; x.font=`bold ${Math.min(30,pr*0.55)}px "DM Sans",sans-serif`; x.textAlign='center'; x.textBaseline='top';
    x.fillText(s.name.length>12?s.name.slice(0,11)+'…':s.name,0,pr+10);
    x.restore(); x.restore();
  });
  for(let i=0;i<24;i++){ const t=i/24*2*Math.PI; x.beginPath(); x.arc(R+(R-12)*Math.cos(t),R+(R-12)*Math.sin(t),5,0,2*Math.PI); x.fillStyle=i%2?'#fff1b8':'#ff7ac0'; x.fill(); }
}
function bindGiftee(){
  const me=myKey(), cv=$('#wheel'); if(!cv) return;
  const segs=wheelSegs(me), g=cfg.pairs[me], gi=Math.max(0,segs.findIndex(s=>s.k===g)), step=360/segs.length;
  const restAt = ((360 - gi*step) % 360);
  cv.style.transition='none';
  cv.style.transform=`rotate(${revealed?restAt:wheelRot}deg)`;
  drawWheel(cv,segs);
  const sp=$('#spin'); if(sp) sp.onclick=()=>{
    if(spinning) return; spinning=true; sp.disabled=true;
    const jitter=(Math.random()-.5)*step*0.6;
    const target = 360*(6+Math.floor(Math.random()*3)) + restAt + jitter;
    SND.play('spin',5.5); SND.say('spin');
    void cv.offsetWidth;
    cv.style.transition='transform 5.5s cubic-bezier(.12,.75,.12,1)';
    cv.style.transform=`rotate(${target}deg)`;
    setTimeout(()=>{ spinning=false; revealed=true; wheelRot=0; SND.play('fanfare'); setTimeout(()=>SND.play('applause'),350); revealLine=SND.pickLine('reveal',{g:nameOf(g)}); setTimeout(()=>SND.say('reveal',{g:nameOf(g),k:nameOf(g).split(' ')[0].toLowerCase()},revealLine),900); confetti(); render(); },5700);
  };
  const h=$('#hide'); if(h) h.onclick=()=>{ revealed=false; render(); };
}
function confetti(){ const c=['#ff2e93','#f5c542','#fff1b8','#ff7ac0','#e8f4ff'];
  for(let i=0;i<70;i++){ const d=document.createElement('div'); d.className='confetti'; d.style.left=Math.random()*100+'vw'; d.style.background=c[i%c.length];
    d.style.animationDelay=Math.random()*.6+'s'; d.style.borderRadius=i%3?'2px':'50%'; document.body.appendChild(d); setTimeout(()=>d.remove(),3600);} }

// ---------- everyone ----------
function allView(me){
  return people().map(p=>{ const its=items.filter(i=>i.owner===p.k);
    return `<div class="card"><h3>${esc(p.name)}${p.k===me?' <span class="muted">(you)</span>':''} <span class="muted">· ${its.length} wish${its.length===1?'':'es'}</span></h3>
      ${its.length?`<div class="items">${its.map(i=>itemCard(i,false)).join('')}</div>`:`<div class="muted">Nothing yet.</div>`}</div>`; }).join('');
}

// ---------- admin ----------
let draft=null;
const exList=()=>(cfg?.exclusions||[]).map(x=>Array.isArray(x)?[...x]:[x.a,x.b]);
function adminView(first){
  if(!draft) draft = { limit: cfg?.limit ?? 150, currency: cfg?.currency || 'A$', dateText: cfg?.dateText || '',
    people: cfg?.people?.length ? cfg.people.map(p=>({...p})) : ['Grant','Matt','Peter','Zach','Ben','Ray (Mother)'].map(n=>({k:uid6(),name:n})),
    exclusions: exList() };
  if(!draft.people.length) draft.people=[{k:uid6(),name:''}];
  const named = draft.people.filter(p=>p.name.trim());
  return `<div class="card"><h2>${first?'Set the stage':"Mother's desk"}</h2><p class="sub">Only you see this. Set the rules, add the divas, then draw.</p>
    <div class="row"><div><label>Gift limit</label><input id="aLim" type="number" inputmode="decimal" min="0" value="${esc(draft.limit)}"></div>
    <div style="max-width:90px"><label>Currency</label><input id="aCur" maxlength="3" value="${esc(draft.currency)}"></div></div>
    ${first&&!cfg?.adminHash?`<label>Mother password (unlocks this desk — don't lose it)</label><input id="aPw" type="password" placeholder="at least 6 characters">`:`<label>Change Mother password (leave blank to keep it)</label><input id="aPw2" type="password" placeholder="new password, 6+ characters">`}
    <label>Exchange date / place (everyone sees this)</label><input id="aDate" maxlength="60" placeholder="e.g. Sat 20 Dec, Ray's place" value="${esc(draft.dateText)}">
    <label>The divas</label><div class="plist" id="plist">${draft.people.map((p,i)=>`<div class="prow"><input data-pi="${i}" maxlength="24" placeholder="Name" value="${esc(p.name)}">
      <span class="st">${claims[p.k]?.pinHash||claimData[p.k]?.pinHash?'joined ✓':''}</span>
      ${claims[p.k]&&!first?`<button class="btn ghost small" data-unclaim="${p.k}" title="Clear their PIN">Reset PIN</button>`:''}
      <button class="btn ghost small" data-rm="${i}" ${cfg?.drawn?'disabled':''}>✕</button></div>`).join('')}</div>
    <button class="btn ghost small" id="aAdd" ${cfg?.drawn?'disabled':''}>+ Add diva</button>
    <label>Never pair (e.g. partners)</label>
    <div class="row"><select id="exA"><option value="">—</option>${named.map(p=>`<option value="${p.k}">${esc(p.name)}</option>`).join('')}</select>
    <select id="exB"><option value="">—</option>${named.map(p=>`<option value="${p.k}">${esc(p.name)}</option>`).join('')}</select>
    <button class="btn ghost small" id="exAdd" style="flex:0 0 auto">Add</button></div>
    <div class="pairs">${draft.exclusions.map((x,i)=>`<span class="pair">${esc(draft.people.find(p=>p.k===x[0])?.name||'?')} ✕ ${esc(draft.people.find(p=>p.k===x[1])?.name||'?')}<button data-exrm="${i}">×</button></span>`).join('')}</div>
    <div class="btns"><button class="btn" id="aSave">Save settings</button></div></div>
    ${first?'':`<div class="card"><h2>The draw</h2>
      <p class="sub">${cfg?.drawn?'Names are drawn. Each diva sees only their own giftee. Redrawing reshuffles everyone, so only do it if someone joins or drops out.':'Everyone gets one giftee, nobody gets themselves, and your “never pair” rules are respected. You\'ll find out who you got the same way as everyone else.'}</p>
      <p class="muted">${Object.keys(claims).length} of ${people().length} have joined.</p>
      <div class="btns"><button class="btn pink" id="aDraw">${cfg?.drawn?'Redraw names':'Draw names ✨'}</button>${cfg?.drawn?`<button class="btn ghost" id="aUndraw">Cancel draw</button>`:''}</div></div>
      <div class="card"><h3>Change Mother password</h3><p class="sub">Pick something only you know. You'll stay logged in on this phone.</p>
      <input id="aNewPw" type="password" placeholder="new password, 6+ characters"><div class="btns"><button class="btn small" id="aPwSave">Update password</button></div></div>
      <div class="card"><h3>Inviting the girls</h3><p class="sub" style="margin:0">Just send them this page's link. They tap their name, set a PIN and start their list. Pick your own name too — Mother plays as well.</p>
      <div class="btns"><button class="btn ghost small" id="aPlay">Go pick my name</button><button class="btn ghost small" id="aOut">Lock Mother's desk</button></div></div>`}`;
}
function syncDraft(){
  if(!$('#aLim')) return;
  draft.limit=$('#aLim').value; draft.currency=$('#aCur').value||'$'; draft.dateText=$('#aDate').value;
  app.querySelectorAll('[data-pi]').forEach(inp=>draft.people[+inp.dataset.pi].name=inp.value);
}
function bindAdmin(){
  $('#aAdd').onclick=()=>{ syncDraft(); draft.people.push({k:uid6(),name:''}); render(); setTimeout(()=>{const a=app.querySelectorAll('[data-pi]');a[a.length-1]?.focus();},0); };
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ syncDraft(); const k=draft.people[+b.dataset.rm].k; draft.people.splice(+b.dataset.rm,1); draft.exclusions=draft.exclusions.filter(x=>!x.includes(k)); render(); });
  app.querySelectorAll('[data-pi]').forEach(inp=>inp.onchange=()=>{ syncDraft(); render(); });
  $('#exAdd').onclick=()=>{ syncDraft(); const a=$('#exA').value,b=$('#exB').value; if(!a||!b||a===b) return toast('Pick two different divas.');
    if(!draft.exclusions.some(x=>x.includes(a)&&x.includes(b))) draft.exclusions.push([a,b]); render(); };
  app.querySelectorAll('[data-exrm]').forEach(b=>b.onclick=()=>{ syncDraft(); draft.exclusions.splice(+b.dataset.exrm,1); render(); });
  app.querySelectorAll('[data-unclaim]').forEach(b=>b.onclick=()=>confirmBox(`Reset ${nameOf(b.dataset.unclaim)}'s PIN?`,'They set a new PIN next time they tap their name. Wishlist and photo stay.',async()=>{
    try{ const k=b.dataset.unclaim; const d={...(claimData[k]||{})}; delete d.pinHash; await (d.avatar?db.doc('claims/'+k).set(d):db.doc('claims/'+k).delete()); toast('PIN cleared.'); }catch(e){ writeFail(e); } }));
  $('#aSave').onclick=async()=>{
    syncDraft();
    const ppl=draft.people.map(p=>({k:p.k,name:p.name.trim()})).filter(p=>p.name);
    if(ppl.length<2) return toast('You need at least two divas, honey.');
    const lower=ppl.map(p=>p.name.toLowerCase()); if(new Set(lower).size!==lower.length) return toast('Two divas share a name — add an initial.');
    let adminHash=cfg?.adminHash;
    const npw=$('#aPw2')?.value||''; if(npw){ if(npw.length<6) return toast('New password needs 6+ characters.'); adminHash=await sha('admin:'+npw); LS.set('admin',adminHash); }
    if(!adminHash){ const pw=$('#aPw')?.value||''; if(pw.length<6) return toast('Set a Mother password (6+ characters).'); adminHash=await sha('admin:'+pw); LS.set('admin',adminHash); }
    const keys=new Set(ppl.map(p=>p.k));
    const next={...(cfg||{}), limit:draft.limit===''?'':Number(draft.limit), currency:draft.currency.trim()||'$', dateText:draft.dateText.trim(), people:ppl,
      exclusions:draft.exclusions.filter(x=>keys.has(x[0])&&keys.has(x[1])).map(x=>({a:x[0],b:x[1]})), drawn:cfg?.drawn||false, pairs:cfg?.pairs||{}, adminHash};
    try{ await db.doc('config/main').set(next); draft=null; toast('Saved. The stage is set 💅'); }catch(e){ writeFail(e); }
  };
  const pw=$('#aPwSave'); if(pw) pw.onclick=async()=>{ const v=$('#aNewPw').value; if(v.length<6) return toast('6+ characters, darling.');
    if(/password/i.test(v)) return toast('Something less guessable, Mother.');
    const h=await sha('admin:'+v); try{ await db.doc('config/main').set({...cfg, adminHash:h}); LS.set('admin',h); $('#aNewPw').value=''; toast('Mother password updated 🔐'); SND.play('sparkle'); }catch(e){ writeFail(e); } };
  const pl=$('#aPlay'); if(pl) pl.onclick=()=>{ tab=myKey()?'list':'pick'; render(); };
  const lo=$('#aOut'); if(lo) lo.onclick=()=>{ LS.set('admin',null); isOwner=false; tab=myKey()?'list':'pick'; render(); };
  const d=$('#aDraw'); if(d) d.onclick=()=>{
    const go=async()=>{ SND.play('whoosh'); const pairs=drawNames(people().map(p=>p.k), exList());
      if(!pairs) return toast('No valid draw with those “never pair” rules. Loosen one.');
      try{ await db.doc('config/main').set({...cfg, drawn:true, pairs, drawnAt:Date.now()}); toast('Names drawn! Tell the girls to check “My giftee” 🎁'); SND.play('oooh'); SND.say('drawn'); }catch(e){ writeFail(e); } };
    cfg.drawn ? confirmBox('Redraw everyone?','Everyone gets a new giftee. Anyone who already looked will need to look again.',go) : go();
  };
  const u=$('#aUndraw'); if(u) u.onclick=()=>confirmBox('Cancel the draw?','Clears all assignments.',async()=>{
    try{ await db.doc('config/main').set({...cfg, drawn:false, pairs:{}}); toast('Draw cancelled.'); }catch(e){ writeFail(e); } });
}
function drawNames(keys, ex){
  const bad=(a,b)=>a===b||ex.some(x=>x.includes(a)&&x.includes(b));
  for(let t=0;t<5000;t++){
    const r=[...keys]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
    if(keys.every((k,i)=>!bad(k,r[i]))){ const p={}; keys.forEach((k,i)=>p[k]=r[i]); return p; }
  }
  return null;
}

// ---------- helpers ----------
function openModal(html){ $('#modalBody').innerHTML=html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function confirmBox(title,msg,yes){
  openModal(`<h2>${esc(title)}</h2><p class="sub">${esc(msg)}</p><div class="btns"><button class="btn pink" id="cY">Yes</button><button class="btn ghost" id="cN">No</button></div>`);
  $('#cN').onclick=closeModal; $('#cY').onclick=async()=>{ closeModal(); await yes(); };
}
function writeFail(e){
  if(e?.code==='demo') return toast('Demo mode: nothing is saved.');
  if(e?.code==='permission-denied') toast('The database said no. Mother needs to check the Firestore rules.');
  else { console.error('save failed',e); toast('That didn\'t save ('+(e?.code||e?.message||'unknown')+'). Screenshot this for Claude.'); }
}
})();
